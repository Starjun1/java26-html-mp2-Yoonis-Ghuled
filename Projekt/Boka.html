    <main class="booking-page">
        <!-- The form section and image are siblings for the reservation grid layout. -->
        <div class="booking-layout">
            <section aria-labelledby="booking-title">
                <h2 id="booking-title">Book a Table</h2>
                <p>Fill out the form to request a reservation.</p>

                <form class="booking-form">
                    <div>
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" autocomplete="name" required>
                    </div>

                    <div>
                        <label for="date">Date:</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div>
                        <label for="time">Time:</label>
                        <input type="time" id="time" name="time" required>
                    </div>

                    <div>
                        <label for="requests">Other requests:</label>
                        <textarea id="requests" name="requests" rows="4"></textarea>
                    </div>

                    <button type="submit">Book Now</button>
                </form>
            </section>

            <img class="booking-image"
                 src="C:\Users\yoonis.ghuled\Documents\HTML\Övninguppgift\Projekt\400px-Tonio_Trussardi_Infobox_Manga.png"
                 alt="Chef Tonio Trussardi">
        </div>
    </main>
